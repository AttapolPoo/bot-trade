mt5:
  login_env: MT5_LOGIN
  password_env: MT5_PASSWORD
  server_env: MT5_SERVER
  path_env: MT5_PATH
  timezone: Etc/UTC
  symbol_fallbacks: ["GOLD#", "XAUUSD", "XAUUSD#", "GOLD", "GOLDm", "XAUUSDm"]

data:
  lookback: 500
  refresh_seconds: 5

profiles:
  scalp_fast:
    symbols: ["XAUUSD", "EURUSD", "US30"]
    timeframes:
      signal_tf: M1
      trend_tf: M5
    strategy: ema_rsi_pullback
    risk:
      risk_per_trade: 0.003
      max_positions: 2
      spread_limit_points: 40
      daily_loss_pct: 0.03
      max_consecutive_losses: 3
      kill_switch_pct: 0.05
      atr_sl_mult: 1.5
      atr_tp_mult: 2.0
      min_rr: 1.3
      trailing_atr_mult: 1.0
      breakeven_rr: 1.0
    guard:
      time_blacklist: ["22:50-23:20"]
      atr_min: 0.1
      atr_max: 3.0
    cooldown_seconds: 60
    cooldown_candles: 1
  intraday:
    symbols: ["XAUUSD", "EURUSD", "GBPUSD"]
    timeframes:
      signal_tf: M5
      trend_tf: M15
    strategy: breakout_atr
    risk:
      risk_per_trade: 0.005
      max_positions: 3
      spread_limit_points: 50
      daily_loss_pct: 0.03
      max_consecutive_losses: 3
      kill_switch_pct: 0.06
      atr_sl_mult: 1.8
      atr_tp_mult: 2.4
      min_rr: 1.4
      trailing_atr_mult: 1.2
      breakeven_rr: 1.0
    guard:
      time_blacklist: ["22:50-23:20"]
      atr_min: 0.1
      atr_max: 4.0
    cooldown_seconds: 120
    cooldown_candles: 1
  swing:
    symbols: ["XAUUSD", "EURUSD", "USDJPY"]
    timeframes:
      signal_tf: H1
      trend_tf: H4
    strategy: mean_reversion_bbands
    risk:
      risk_per_trade: 0.005
      max_positions: 2
      spread_limit_points: 70
      daily_loss_pct: 0.025
      max_consecutive_losses: 3
      kill_switch_pct: 0.07
      atr_sl_mult: 2.0
      atr_tp_mult: 2.8
      min_rr: 1.5
      trailing_atr_mult: 1.0
      breakeven_rr: 0.8
    guard:
      time_blacklist: ["22:50-23:20"]
      atr_min: 0.1
      atr_max: 5.0
    cooldown_seconds: 1800
    cooldown_candles: 1
  xm_gold_intraday:
    symbols: ["GOLD#"]
    timeframes:
      signal_tf: M15
      trend_tf: H1
    strategy: ema_rsi_pullback
    risk:
      risk_per_trade: 0.005
      max_positions: 1
      spread_limit_points: 60
      daily_loss_pct: 0.03
      max_consecutive_losses: 3
      kill_switch_pct: 0.05
      atr_sl_mult: 2.0
      atr_tp_mult: 3.0
      min_rr: 1.5
      trailing_atr_mult: 1.0
      breakeven_rr: 1.0
    guard:
      time_blacklist: ["22:50-23:20"]
      atr_min: 0.15
      atr_max: 3.0
    cooldown_seconds: 120
    cooldown_candles: 1
  xm_gold_scalp:
    symbols: ["GOLD#"]
    timeframes:
      signal_tf: M5
      trend_tf: M15
    strategy: ema_rsi_pullback
    risk:
      risk_per_trade: 0.005
      max_positions: 1
      spread_limit_points: 60
      daily_loss_pct: 0.03
      max_consecutive_losses: 3
      kill_switch_pct: 0.05
      atr_sl_mult: 1.8
      atr_tp_mult: 2.2
      min_rr: 1.2
      trailing_atr_mult: 1.0
      breakeven_rr: 1.0
    guard:
      time_blacklist: ["22:50-23:20"]
      atr_min: 0.12
      atr_max: 3.0
    cooldown_seconds: 60
    cooldown_candles: 1

strategy_params:
  ema_rsi_pullback:
    ema_fast: 21
    ema_slow: 50
    ema_trend_fast: 50
    ema_trend_slow: 200
    rsi_period: 14
    rsi_buy: 45
    rsi_sell: 55
    atr_period: 14
    max_candle_body_atr: 3.0
    atr_silence_threshold: 0.2
    atr_sl_mult: 2.0
    atr_tp_mult: 3.0
  breakout_atr:
    atr_period: 14
    breakout_lookback: 20
    atr_filter_min: 0.15
    atr_sl_mult: 1.8
    atr_tp_mult: 2.4
  mean_reversion_bbands:
    bbands_period: 20
    bbands_std: 2.0
    rsi_period: 14
    rsi_low: 35
    rsi_high: 65
    atr_filter_max: 1.5
    atr_period: 14

execution:
  magic: 525252
  deviation: 30
  slippage_guard_points: 60
  volume_min: 0.01
  volume_step: 0.01
  comment: mt5-framework
  retries: 2
  retry_sleep: 1.0
  dry_run: true
  journal_csv: journal.csv

logging:
  level: INFO
  file: logs/framework.log
  max_bytes: 1048576
  backup_count: 5

loop:
  poll_seconds: 15
  backoff_seconds: 30
  max_total_positions: 5
